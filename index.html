*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:17px/1.55 ui-rounded,"Avenir Next Rounded","Trebuchet MS",system-ui,sans-serif}
main{max-width:640px;margin:0 auto;padding:16px 16px 120px}
h1{font-size:1.65rem;line-height:1.2;margin:.3em 0 .2em}
p{margin:.4em 0}
.mut,.note{color:var(--mut)}
.note{font-size:.9rem;margin-top:18px}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
.sun{position:relative;background:var(--sun);color:var(--onsun);border-radius:28px;padding:20px 20px 22px;overflow:hidden}
.sun h1{margin-top:0}
.sunE{position:absolute;right:12px;top:6px;font-size:3.6rem;opacity:.9}
.sun .lbl{font-weight:700;margin-top:14px}
.sun .ref{font-size:1.25rem;font-weight:800;margin:0}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:16px}
.tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:96px;background:var(--card);border:2px solid var(--bd);border-radius:22px;font-weight:700}
.tile span{font-size:2.2rem}
.row{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--card);border:2px solid var(--bd);border-radius:18px;padding:12px 14px;margin-top:10px}
.row .e{font-size:2rem}
.row b{display:block}
.row small{color:var(--mut)}
.back{background:none;border:0;color:var(--pri);font-weight:700;padding:8px 0}
.bigE{font-size:4rem;line-height:1}
.story{font-size:1.15rem;line-height:1.75}
.btn{display:inline-block;background:var(--pri);color:var(--onpri);border:0;border-radius:999px;padding:12px 22px;font-weight:700;margin:8px 8px 8px 0}
.btn.sec{background:var(--card);color:var(--pri);border:2px solid var(--pri)}
.box{border-radius:18px;padding:14px 16px;margin-top:14px}
.box.leaf{background:var(--leaf);color:var(--onleaf)}
.box.sunb{background:var(--sun);color:var(--onsun)}
input[type=search]{width:100%;background:var(--card);border:2px solid var(--bd);border-radius:18px;padding:14px 16px;margin-top:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.chip{background:var(--card);border:2px solid var(--bd);border-radius:999px;padding:8px 14px;font-weight:700}
.vc{background:var(--card);border:2px solid var(--bd);border-left:8px solid var(--sun);border-radius:18px;padding:12px 16px;margin-top:12px}
.vc b{font-size:1.1rem}
.opt{display:block;width:100%;text-align:left;background:var(--card);border:2px solid var(--bd);border-radius:18px;padding:14px 16px;margin-top:10px;font-weight:600}
.opt.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.no{background:var(--no);border-color:var(--no);color:#fff}
.stars{font-size:2.2rem;letter-spacing:4px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:2px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:0;padding:8px 2px 10px;font-size:.8rem;color:var(--mut)}
.tab span{font-size:1.5rem;line-height:1.1}
.tab.on{color:var(--pri);font-weight:800}
.qcard{background:var(--card);border:2px solid var(--bd);border-radius:28px;padding:16px;margin-top:16px}
.chip.on{background:var(--pri);color:var(--onpri);border-color:var(--pri)}
.qcard h2{margin:0 0 4px}
.lvb{display:block;width:100%;text-align:left;border:0;border-radius:18px;padding:13px 16px;margin-top:10px;font-weight:700}
.l1{background:#BDEBD0;color:#0F4A2C}.l2{background:var(--sun);color:var(--onsun)}.l3{background:#FFB4A8;color:#5A1208}
</style>

{e:"🌱",t:"Perumpamaan Penabur",r:"Matius 13:1–9",v:23,s:"Seorang penabur menebar benih. Ada yang jatuh di pinggir jalan, di tanah berbatu, di semak duri, dan di tanah yang baik. Hanya benih di tanah yang baik yang tumbuh dan berbuah banyak.",p:"Hati yang mau mendengar firman Tuhan seperti tanah yang baik."},
{e:"🚶",t:"Yesus Berjalan di Atas Air",r:"Matius 14:22–33",v:21,s:"Malam hari, Yesus berjalan di atas danau menuju perahu murid-murid. Petrus ikut berjalan di atas air, tetapi takut melihat angin kencang lalu mulai tenggelam. Yesus segera menolongnya.",p:"Tetaplah memandang Yesus dan jangan takut."},
{e:"👀",t:"Bartimeus Dicelikkan",r:"Markus 10:46–52",v:22,s:"Bartimeus, seorang yang buta, duduk di pinggir jalan. Ia terus berseru meminta tolong kepada Yesus walau orang-orang menyuruhnya diam. Yesus menyembuhkannya, lalu ia mengikut Yesus.",p:"Jangan berhenti meminta tolong kepada Yesus."},
{e:"🛏️",t:"Orang Lumpuh dan Empat Sahabat",r:"Markus 2:1–12",v:11,s:"Empat sahabat membawa teman mereka yang lumpuh kepada Yesus. Karena rumah penuh, mereka membongkar atap dan menurunkannya. Yesus mengampuni dan menyembuhkan orang itu.",p:"Sahabat sejati saling menolong datang kepada Yesus."},
{e:"🔔",t:"Lazarus Dibangkitkan",r:"Yohanes 11:1–44",v:1,s:"Lazarus, sahabat Yesus, sudah meninggal empat hari. Yesus menangis bersama keluarganya, lalu memanggil Lazarus keluar dari kubur, dan Lazarus hidup kembali.",p:"Yesus berkuasa atas kematian dan peduli pada kesedihan kita."},
{e:"💧",t:"Yesus dan Perempuan Samaria",r:"Yohanes 4:1–30",v:0,s:"Yesus beristirahat di sumur dan berbicara dengan seorang perempuan Samaria. Yesus berkata Dia memberi air hidup yang membuat kita tidak haus lagi. Perempuan itu percaya dan menceritakan Yesus kepada orang sekotanya.",p:"Yesus menerima semua orang dan memberi hidup baru."},
{e:"🧎",t:"Yesus Berdoa di Getsemani",r:"Matius 26:36–46",v:14,s:"Sebelum disalibkan, Yesus berdoa di taman Getsemani dan berkata, jadilah kehendak-Mu. Murid-murid tertidur, tetapi Yesus tetap taat kepada Bapa-Nya.",p:"Kita boleh berdoa jujur kepada Allah dan percaya pada rencana-Nya."},
{e:"✝️",t:"Yesus Disalibkan",r:"Lukas 23:33–49",v:26,s:"Yesus disalibkan di bukit Golgota. Meski kesakitan, Ia berdoa supaya Bapa mengampuni orang-orang yang menyalibkan-Nya. Seorang penjahat di sebelah-Nya percaya, dan Yesus berjanji ia akan bersama-Nya di Firdaus.",p:"Yesus rela mati karena kasih-Nya, supaya dosa kita diampuni."},
{e:"🔑",t:"Thomas Percaya",r:"Yohanes 20:24–29",v:30,s:"Thomas tidak mau percaya sebelum melihat sendiri bahwa Yesus bangkit. Delapan hari kemudian Yesus muncul dan mengajak Thomas melihat bekas luka-Nya. Thomas berseru bahwa Yesus adalah Tuhan dan Allahnya.",p:"Percaya kepada Yesus walau tidak melihat-Nya itu berharga."},
{e:"🏖️",t:"Sarapan di Tepi Pantai",r:"Yohanes 21:1–14",v:22,s:"Petrus dan teman-temannya menjala semalaman tanpa hasil. Yesus berdiri di pantai dan menyuruh mereka menebar jala di sisi kanan, lalu jala itu penuh ikan. Yesus sudah menyiapkan sarapan untuk mereka.",p:"Yesus peduli pada kebutuhan kita."},
{e:"🌾",t:"Biji Sesawi",r:"Matius 13:31–32",v:30,s:"Biji sesawi sangat kecil, tetapi tumbuh menjadi pohon besar sampai burung bersarang di dahannya. Yesus berkata Kerajaan Allah seperti itu.",p:"Iman yang kecil pun bisa tumbuh besar."},
{e:"💰",t:"Persembahan Janda Miskin",r:"Markus 12:41–44",v:29,s:"Banyak orang kaya memasukkan uang banyak ke kotak persembahan. Seorang janda miskin memberikan dua keping uang kecil, semua yang ia punya. Yesus berkata ia memberi paling banyak karena memberi dengan segenap hati.",p:"Allah melihat hati kita saat memberi."},
{e:"🔥",t:"Hari Pentakosta",r:"Kisah Para Rasul 2:1–13",v:17,s:"Para murid berkumpul bersama. Tiba-tiba terdengar bunyi seperti angin kencang, dan Roh Kudus turun seperti lidah api. Mereka berbicara dalam berbagai bahasa tentang perbuatan besar Allah.",p:"Roh Kudus menolong kita bersaksi tentang Yesus."},
{e:"⚡",t:"Saulus Bertemu Yesus",r:"Kisah Para Rasul 9:1–19",v:27,s:"Saulus dulu menganiaya pengikut Yesus. Dalam perjalanan ke Damsyik, cahaya terang menyinarinya dan Yesus berbicara kepadanya. Saulus berubah dan kemudian dikenal sebagai Paulus.",p:"Yesus bisa mengubah siapa saja menjadi baik."},
{e:"🚪",t:"Petrus Keluar dari Penjara",r:"Kisah Para Rasul 12:1–17",v:2,s:"Petrus dipenjara, dan jemaat berdoa dengan sungguh-sungguh. Malaikat membangunkan Petrus, rantainya terlepas, dan pintu penjara terbuka sendiri.",p:"Doa kita didengar Tuhan."},
{e:"🌈",t:"Langit dan Bumi yang Baru",r:"Wahyu 21:1–5",v:28,s:"Rasul Yohanes melihat langit dan bumi yang baru. Allah akan tinggal bersama umat-Nya, menghapus setiap air mata, dan tidak ada lagi kesedihan.",p:"Allah menyiapkan masa depan yang indah bagi mereka yang percaya."}

const lvBtns=()=>`<button class="lvb l1" onclick="start(1);go('quiz')">🌱 Mudah: pelajaran dari cerita</button><button class="lvb l2" onclick="start(2);go('quiz')">🌿 Sedang: kitab dan ayat emas</button><button class="lvb l3" onclick="start(3);go('quiz')">🌳 Sulit: ayat, pasal, dan cerita</button>`;
function qsOld(lv){
  const pick=(a,n)=>shuf(a).slice(0,n);
  const opts=(r,pool,n)=>shuf([r,...pick([...new Set(pool)].filter(x=>x!==r),n-1)]).map(t=>({t,c:t===r}));
  const bk=s=>s.r.replace(/\s\d.*$/,"");
  if(lv===1)return pick(S,5).map(s=>s.q&&Math.random()<.8?{q:s.q[0],o:shuf(s.q[1].map((t,i)=>({t,c:i===0})))}:{q:"Apa pelajaran dari cerita “"+s.t+"”?",o:opts(s.p,S.map(x=>x.p),3)});
  if(lv===2)return pick(S,5).map(s=>({q:"Cerita “"+s.t+"” ada di kitab apa?",o:opts(bk(s),S.map(bk),4)}));
  return pick(V,5).map(v=>({q:"Ayat ini tertulis di mana? “"+v.m+"”",o:opts(v.r,V.map(x=>x.r),4)}));
}
const rows=f=>S.map((s,i)=>({s,i})).filter(x=>(x.s.t+x.s.r).toLowerCase().includes(f.toLowerCase())).map(x=>`<button class="row" onclick="go('stories',${x.i})"><span class="e" aria-hidden="true">${x.s.e}</span><span><b>${OPEN.has(x.s.t)?"✅ ":""}${x.s.t}</b><small>${x.s.r}</small></span></button>`).join("")||"<p>Tidak ada cerita yang cocok.</p>";
function fl(f){document.getElementById("sl").innerHTML=rows(f)}
const L={
"Kelahiran Yesus":["Di kota kecil Nazaret, hiduplah seorang perempuan bernama Maria dan tunangannya, Yusuf. Suatu hari, pemerintah menyuruh semua orang pulang ke kota asal mereka untuk didaftar. Maka Maria dan Yusuf menempuh perjalanan jauh ke Betlehem. Malam sudah tiba, dan Maria hampir melahirkan.","Yusuf mengetuk pintu penginapan satu per satu, tetapi semuanya penuh. Akhirnya mereka bermalam di sebuah kandang yang hangat bersama hewan-hewan. Di sanalah Yesus lahir. Maria membungkus-Nya dengan kain dan membaringkan-Nya di palungan, tempat makan hewan.","Di padang dekat situ, para gembala sedang menjaga domba. Tiba-tiba langit bersinar terang! Malaikat berkata, “Jangan takut! Hari ini telah lahir bagimu Juruselamat.” Para gembala berlari ke Betlehem dan menemukan Bayi itu, persis seperti kata malaikat. Mereka pulang sambil memuji Allah dengan gembira."],
"Lima Roti dan Dua Ikan":["Hari itu, ribuan orang mengikuti Yesus ke tepi danau untuk mendengarkan ajaran-Nya dan melihat Dia menyembuhkan orang sakit. Hari makin sore, dan mereka mulai lapar. Murid-murid bingung. “Uang kita tidak cukup untuk membeli makanan bagi orang sebanyak ini!” kata mereka.","Lalu Andreas menemukan seorang anak laki-laki yang membawa lima roti jelai dan dua ikan kecil. Anak itu tidak ragu memberikannya kepada Yesus. “Tetapi apa artinya ini untuk orang sebanyak itu?” tanya Andreas. Yesus tersenyum dan menyuruh semua orang duduk di rumput hijau.","Yesus mengambil roti dan ikan itu, mengucap syukur kepada Bapa, lalu membagi-bagikannya. Anehnya, makanan itu tidak habis-habis! Semua orang makan sampai kenyang. Setelah itu murid-murid mengumpulkan sisanya, dan terkumpul dua belas bakul penuh. Anak kecil itu pasti takjub melihat pemberiannya dipakai Tuhan."],
"Yesus Menenangkan Badai":["Sore itu Yesus telah mengajar seharian dan sangat lelah. Ia berkata kepada murid-murid-Nya, “Mari kita menyeberang ke seberang danau.” Mereka naik perahu, dan Yesus segera tertidur dengan kepala di atas bantal di bagian belakang perahu.","Tiba-tiba angin kencang bertiup. Ombak besar menghantam perahu dan air mulai masuk. Murid-murid yang pandai menjala pun ketakutan. Mereka membangunkan Yesus sambil berteriak, “Guru, Engkau tidak peduli kita akan binasa?”","Yesus bangun, lalu berkata kepada angin, “Diam!” dan kepada danau, “Tenanglah!” Seketika angin berhenti dan air menjadi setenang kaca. Yesus bertanya, “Mengapa kamu begitu takut? Di mana imanmu?” Murid-murid terheran-heran dan berkata satu sama lain, “Siapakah orang ini, sampai angin dan danau pun menaati-Nya?”"],
"Orang Samaria yang Baik":["Suatu hari seorang ahli Taurat bertanya kepada Yesus, “Siapakah sesamaku manusia?” Yesus menjawab dengan sebuah cerita. Seorang laki-laki berjalan dari Yerusalem ke Yerikho. Di tengah jalan yang sepi, perampok menyerangnya, mengambil semua miliknya, lalu meninggalkannya terluka parah.","Lalu lewatlah seorang imam. Ia melihat orang itu, tetapi memilih berjalan di sisi lain jalan. Kemudian lewat seorang Lewi, dan ia pun melakukan hal yang sama. Orang yang terluka itu pasti sangat sedih dan kesakitan.","Akhirnya datang seorang Samaria, orang yang biasanya tidak disukai orang Yahudi. Ia merasa kasihan, lalu membersihkan dan membalut luka itu, menaikkannya ke keledainya, dan membawanya ke penginapan. Ia bahkan membayar biaya perawatannya! Yesus bertanya, “Menurutmu, siapa yang menjadi sesama bagi orang itu?” Jawabnya, “Orang yang menunjukkan belas kasihan.” Kata Yesus, “Pergilah dan perbuatlah demikian.”"],
"Anak yang Hilang":["Seorang ayah mempunyai dua anak laki-laki. Suatu hari si bungsu berkata, “Ayah, berikan bagian hartaku sekarang.” Sang ayah sedih, tetapi ia memberikannya. Tak lama kemudian, si bungsu pergi ke negeri yang jauh dan menghabiskan semua uangnya untuk bersenang-senang.","Ketika uangnya habis, datanglah kelaparan hebat. Si bungsu terpaksa bekerja menjaga babi, dan ia begitu lapar sampai ingin makan makanan babi. Saat itulah ia sadar, “Di rumah ayahku, para pekerja pun makan kenyang. Aku akan pulang dan meminta maaf.”","Ia berjalan pulang dengan hati berdebar. Dari kejauhan, ayahnya sudah melihatnya dan berlari menyongsongnya! Sang ayah memeluk dan menciumnya. Si bungsu berkata, “Ayah, aku telah berdosa.” Namun sang ayah memerintahkan, “Bawa jubah terbaik, pakaikan cincin, dan mari kita berpesta! Anakku yang hilang telah ditemukan.”"],
"Zakheus Bertemu Yesus":["Di kota Yerikho tinggal seorang pemungut cukai bernama Zakheus. Ia kaya, tetapi banyak orang tidak menyukainya karena ia sering mengambil uang lebih dari yang seharusnya. Zakheus pasti kesepian. Ia mendengar bahwa Yesus akan lewat, dan ia sangat ingin melihat-Nya.","Namun jalanan penuh sesak, dan Zakheus bertubuh pendek. Ia tidak bisa melihat apa pun di antara kerumunan! Maka ia berlari lebih dulu dan memanjat pohon ara. Dari atas dahan, ia menunggu dengan jantung berdebar.","Ketika Yesus tiba di bawah pohon itu, Ia menengadah dan berkata, “Zakheus, segeralah turun! Hari ini Aku akan menumpang di rumahmu.” Zakheus turun dengan gembira. Orang banyak mengomel, tetapi Zakheus berkata, “Tuhan, setengah hartaku kuberikan kepada orang miskin, dan jika aku memeras seseorang, kukembalikan empat kali lipat.” Yesus berkata, “Hari ini keselamatan datang ke rumah ini.”"],
"Yesus Memberkati Anak-anak":["Suatu hari banyak orang tua membawa anak-anak mereka kepada Yesus. Mereka ingin Yesus meletakkan tangan dan mendoakan anak-anak itu. Ada bayi yang digendong, dan ada anak-anak kecil yang berlari ingin melihat Yesus.","Namun murid-murid menegur mereka. “Jangan ganggu Guru! Ia sedang sibuk,” kata mereka. Anak-anak itu pun mungkin mulai ragu dan mundur. Ketika Yesus melihat hal itu, Ia menjadi tidak senang kepada murid-murid-Nya.","Yesus berkata, “Biarkan anak-anak itu datang kepada-Ku, jangan menghalangi mereka! Sebab orang-orang seperti merekalah yang memiliki Kerajaan Allah.” Lalu Yesus memeluk anak-anak itu, meletakkan tangan-Nya atas mereka, dan memberkati mereka satu per satu. Betapa hangat dan bahagianya hari itu!"],
"Yesus Bangkit":["Setelah Yesus wafat, murid-murid-Nya sangat sedih dan takut. Tubuh Yesus dibaringkan di sebuah kubur yang ditutup dengan batu besar. Hari Sabat berlalu, dan pada hari Minggu pagi-pagi sekali, beberapa perempuan yang mengasihi Yesus pergi ke kubur sambil membawa rempah-rempah wangi.","Dalam perjalanan, mereka cemas, “Siapa yang akan menggulingkan batu yang besar itu?” Tetapi sesampainya di sana, batu itu sudah terguling! Mereka masuk dan tidak menemukan tubuh Yesus. Tiba-tiba dua laki-laki berpakaian bercahaya berdiri di dekat mereka, dan para perempuan itu gemetar ketakutan.","Malaikat berkata, “Mengapa kamu mencari Dia yang hidup di antara orang mati? Ia tidak ada di sini, Ia telah bangkit!” Para perempuan itu berlari menemui murid-murid dan menceritakan kabar sukacita itu. Sejak hari itu, orang-orang yang percaya tahu bahwa Yesus hidup untuk selama-lamanya."],
"Yesus Berjalan di Atas Air":["Setelah memberi makan ribuan orang, Yesus menyuruh murid-murid-Nya naik perahu lebih dulu. Ia sendiri naik ke bukit untuk berdoa sendirian. Malam makin gelap, dan angin bertiup melawan perahu mereka di tengah danau.","Menjelang fajar, murid-murid melihat sosok berjalan di atas air! “Hantu!” teriak mereka ketakutan. Tetapi Yesus berkata, “Tenanglah, Aku ini, jangan takut!” Petrus menjawab, “Tuhan, kalau itu Engkau, suruhlah aku berjalan di atas air.” Yesus berkata, “Datanglah!”","Petrus turun dari perahu dan berjalan menuju Yesus. Namun ketika ia melihat angin yang kencang, ia menjadi takut dan mulai tenggelam. “Tuhan, tolong aku!” serunya. Yesus segera mengulurkan tangan dan memegangnya. “Hai orang yang kurang percaya, mengapa engkau bimbang?” Ketika mereka naik ke perahu, angin pun reda."],
"Bartimeus Dicelikkan":["Di pinggir jalan dekat kota Yerikho, duduklah seorang laki-laki buta bernama Bartimeus. Setiap hari ia hanya bisa meminta-minta karena tidak bisa melihat. Suatu hari ia mendengar suara ramai orang banyak lewat. “Ada apa?” tanyanya. “Yesus dari Nazaret sedang lewat,” jawab seseorang.","Bartimeus langsung berseru sekeras-kerasnya, “Yesus, Anak Daud, kasihanilah aku!” Banyak orang menyuruhnya diam, tetapi ia berseru makin keras. Yesus berhenti dan berkata, “Panggillah dia!” Orang-orang pun berkata kepadanya, “Kuatkan hatimu, Ia memanggil engkau.”","Bartimeus melompat dan melemparkan jubahnya, lalu datang kepada Yesus. “Apa yang kauinginkan?” tanya Yesus. “Guru, supaya aku dapat melihat!” Kata Yesus, “Pergilah, imanmu telah menyelamatkan engkau.” Seketika matanya terbuka. Bartimeus tidak pulang, tetapi mengikuti Yesus di jalan sambil memuji Allah."]
};
Object.assign(L,{
"Malaikat Mendatangi Maria":["Di kota Nazaret hiduplah seorang gadis bernama Maria. Ia sedang bertunangan dengan Yusuf, seorang tukang kayu yang baik hati. Suatu hari, tiba-tiba ada cahaya terang di dekatnya, dan seorang malaikat bernama Gabriel berdiri di hadapannya.","“Jangan takut, Maria,” kata Gabriel. “Allah sangat berkenan kepadamu. Engkau akan mengandung dan melahirkan seorang Anak laki-laki. Namai Dia Yesus. Dia akan disebut Anak Allah yang Mahatinggi.” Maria bingung dan bertanya bagaimana hal itu mungkin terjadi.","Gabriel menjelaskan bahwa Roh Kudus akan menyertainya, karena bagi Allah tidak ada yang mustahil. Maria berpikir sejenak, lalu dengan tenang ia menjawab, “Aku ini hamba Tuhan. Jadilah padaku menurut perkataanmu.” Malaikat itu pun pergi, dan hati Maria dipenuhi sukacita."],
"Orang Majus Mencari Yesus":["Jauh di sebelah timur, ada orang-orang bijak yang suka mempelajari bintang. Suatu malam mereka melihat bintang yang sangat istimewa. Mereka tahu bintang itu menandakan lahirnya seorang Raja yang besar. Maka mereka menyiapkan unta dan hadiah, lalu berangkat jauh sekali.","Mereka tiba di Yerusalem dan bertanya, “Di manakah Raja yang baru lahir itu?” Raja Herodes terkejut dan merasa iri. Ia berpura-pura ingin menyembah juga, padahal hatinya jahat. Orang-orang bijak itu kembali melanjutkan perjalanan, dan bintang itu bergerak mendahului mereka.","Bintang itu berhenti tepat di atas tempat Yesus berada. Mereka sangat bersukacita! Di dalam rumah, mereka melihat Yesus bersama Maria, lalu sujud menyembah-Nya. Mereka membuka peti harta dan memberikan emas, kemenyan, dan mur. Karena diperingatkan dalam mimpi, mereka pulang lewat jalan lain."],
"Yesus Dibaptis":["Yohanes Pembaptis tinggal di padang gurun dekat sungai Yordan. Ia memakai pakaian dari bulu unta dan makan madu hutan. Banyak orang datang kepadanya, mengakui kesalahan mereka, lalu dibaptis di sungai sebagai tanda ingin hidup baru.","Suatu hari Yesus datang dari Galilea kepada Yohanes dan minta dibaptis. Yohanes terkejut dan berkata, “Seharusnya aku yang dibaptis oleh-Mu!” Tetapi Yesus menjawab bahwa inilah yang Allah inginkan, sehingga Yohanes pun menurut.","Setelah Yesus dibaptis dan keluar dari air, langit terbuka! Roh Allah turun seperti burung merpati dan hinggap pada-Nya. Lalu terdengar suara dari surga, “Inilah Anak-Ku yang Kukasihi, kepada-Nyalah Aku berkenan.” Allah Bapa, Yesus, dan Roh Kudus hadir bersama di tepi sungai itu."],
"Yesus Memanggil Murid":["Pagi itu Yesus berjalan di tepi danau Galilea. Di sana ada dua kakak beradik, Simon yang disebut Petrus, dan Andreas. Mereka nelayan yang sedang melemparkan jala ke danau. Pekerjaan itu keras, dan jala mereka sering kosong.","Yesus memanggil mereka, “Marilah, ikutlah Aku, dan kamu akan Kujadikan penjala manusia.” Petrus dan Andreas saling berpandangan. Mereka tidak tahu apa yang menanti, tetapi mereka percaya kepada Yesus. Saat itu juga mereka meninggalkan jala dan mengikut-Nya.","Tidak jauh dari situ, Yesus melihat dua bersaudara lain, Yakobus dan Yohanes, sedang memperbaiki jala bersama ayah mereka, Zebedeus. Yesus memanggil mereka juga, dan mereka pun langsung ikut. Sejak hari itu, mereka berjalan bersama Yesus, belajar, dan menjadi sahabat-Nya."],
"Orang Lumpuh dan Empat Sahabat":["Di kota Kapernaum, Yesus sedang mengajar di sebuah rumah. Rumah itu begitu penuh sampai tidak ada tempat lagi, bahkan di depan pintu. Sementara itu, ada empat orang laki-laki yang menggotong sahabat mereka yang lumpuh di atas tikar. Mereka ingin sekali membawanya kepada Yesus.","Karena tidak bisa masuk lewat pintu, mereka punya ide yang berani. Mereka naik ke atap, membongkar sebagian atapnya, lalu menurunkan sahabat mereka dengan tali ke depan Yesus. Orang-orang di dalam pasti kaget melihat debu berjatuhan dari atas!","Yesus melihat iman keempat sahabat itu, lalu berkata kepada orang lumpuh itu, “Dosamu sudah diampuni.” Kemudian Ia berkata, “Bangunlah, angkat tikarmu, dan pulanglah.” Seketika orang itu berdiri, membawa tikarnya, dan berjalan keluar. Semua orang takjub dan memuji Allah."],
"Lazarus Dibangkitkan":["Di desa Betania tinggal tiga bersaudara, Maria, Marta, dan Lazarus. Mereka sahabat Yesus. Suatu hari Lazarus sakit parah, dan kedua saudarinya mengirim pesan kepada Yesus. Namun Yesus baru tiba empat hari setelah Lazarus meninggal.","Marta berlari menemui Yesus, “Tuhan, seandainya Engkau di sini, saudaraku tidak mati.” Yesus berkata, “Akulah kebangkitan dan hidup.” Ketika Yesus melihat Maria dan banyak orang menangis, hati-Nya sangat tersentuh, dan Yesus pun menangis.","Yesus pergi ke kubur Lazarus dan menyuruh batu penutupnya digulingkan. Setelah berdoa kepada Bapa, Ia berseru dengan suara keras, “Lazarus, keluarlah!” Lazarus keluar, masih terbungkus kain kafan. Kata Yesus, “Bukalah kain itu dan biarkan dia pergi.” Tangis kesedihan pun berubah menjadi sukacita."],
"Yesus dan Perempuan Samaria":["Siang yang terik, Yesus dan murid-murid-Nya tiba di dekat kota Sikhar di Samaria. Yesus lelah, jadi Ia duduk di tepi sumur Yakub, sementara murid-murid pergi membeli makanan. Tidak lama kemudian datanglah seorang perempuan Samaria membawa timba untuk mengambil air.","Yesus berkata, “Berilah Aku minum.” Perempuan itu heran, karena orang Yahudi biasanya tidak mau bicara dengan orang Samaria. Yesus berkata, “Kalau engkau tahu siapa Aku, engkau akan meminta air hidup kepada-Ku. Orang yang meminumnya tidak akan haus lagi.”","Yesus mengetahui seluruh kehidupan perempuan itu, dan Ia tetap menerimanya dengan kasih. Perempuan itu percaya, lalu meninggalkan timbanya dan berlari ke kota. “Marilah, lihatlah Orang yang mengatakan semua yang pernah kuperbuat!” Banyak orang Samaria datang, mendengar Yesus, dan percaya kepada-Nya."],
"Yesus Disalibkan":["Yesus ditangkap oleh orang-orang yang membenci-Nya, padahal Ia tidak bersalah. Para pemimpin menyerahkan-Nya untuk disalibkan. Yesus memikul salib-Nya sampai ke bukit yang bernama Golgota. Banyak orang yang mengasihi-Nya mengikuti dari jauh sambil menangis.","Di bukit itu, Yesus disalibkan di antara dua penjahat. Meski sangat kesakitan, Ia berdoa, “Ya Bapa, ampunilah mereka, sebab mereka tidak tahu apa yang mereka perbuat.” Salah satu penjahat berkata, “Yesus, ingatlah aku.” Yesus menjawab, “Hari ini juga engkau akan bersama-sama Aku di Firdaus.”","Siang berubah gelap selama tiga jam. Lalu Yesus berseru, “Ya Bapa, ke dalam tangan-Mu Kuserahkan nyawa-Ku,” dan Ia wafat. Seorang perwira yang berdiri di dekat salib berkata, “Sungguh, orang ini adalah orang benar.” Yesus rela melakukan semuanya karena Ia sangat mengasihi kita. Namun cerita ini tidak berhenti di sini, sebab Yesus akan bangkit!"],
"Thomas Percaya":["Setelah Yesus bangkit, Ia menampakkan diri kepada murid-murid-Nya pada malam hari ketika pintu rumah terkunci. Murid-murid sangat gembira melihat-Nya. Tetapi Thomas, salah satu murid, tidak ada di sana saat itu.","Ketika Thomas pulang, teman-temannya berkata, “Kami sudah melihat Tuhan!” Thomas menggeleng, “Aku tidak akan percaya sebelum aku melihat bekas paku di tangan-Nya dan menyentuhnya sendiri.” Seminggu lamanya ia terus ragu.","Delapan hari kemudian, murid-murid berkumpul lagi, kali ini bersama Thomas. Yesus tiba-tiba berdiri di tengah mereka dan berkata, “Damai sejahtera bagi kamu.” Kepada Thomas, Ia berkata, “Lihatlah tangan-Ku dan jangan lagi tidak percaya.” Thomas terharu dan berseru, “Tuhanku dan Allahku!” Yesus berkata, “Berbahagialah mereka yang tidak melihat, namun percaya.”"],
"Saulus Bertemu Yesus":["Ada seorang laki-laki bernama Saulus yang sangat marah kepada para pengikut Yesus. Ia menangkap mereka dan memasukkan mereka ke penjara. Suatu hari ia berangkat ke kota Damsyik untuk menangkap lebih banyak lagi.","Di tengah perjalanan, tiba-tiba cahaya yang sangat terang dari langit menyinarinya. Saulus jatuh ke tanah dan terdengar suara, “Saulus, mengapa engkau menganiaya Aku?” “Siapakah Engkau, Tuhan?” tanya Saulus. “Aku Yesus yang kauaniaya itu.” Saat bangun, mata Saulus tidak bisa melihat, dan teman-temannya menuntunnya ke kota.","Tiga hari kemudian, Tuhan menyuruh seorang murid bernama Ananias untuk mendoakan Saulus. Ananias takut, tetapi ia menurut. Ia meletakkan tangan di atas Saulus, dan seketika sesuatu seperti sisik jatuh dari mata Saulus, sehingga ia dapat melihat lagi. Saulus dibaptis, dan kemudian ia dikenal sebagai Paulus, yang memberitakan kabar baik tentang Yesus ke banyak negeri."]
});
Object.assign(L,{
"Yesus Kecil di Bait Allah":["Setiap tahun, Maria dan Yusuf pergi ke Yerusalem untuk merayakan Paskah bersama banyak orang dari kampung mereka. Ketika Yesus berumur dua belas tahun, Ia ikut pergi. Setelah pesta selesai, rombongan pulang ke Nazaret, tetapi Yesus tetap tinggal di Yerusalem tanpa diketahui orang tua-Nya.","Maria dan Yusuf mengira Yesus berjalan bersama rombongan. Setelah sehari perjalanan, mereka mencari-Nya di antara saudara dan kenalan, tetapi tidak ketemu. Dengan cemas mereka kembali ke Yerusalem dan mencari-Nya selama tiga hari.","Akhirnya mereka menemukan Yesus di Bait Allah, sedang duduk di antara para guru, mendengarkan dan bertanya. Semua orang kagum akan pengertian-Nya. Maria berkata, “Nak, mengapa Engkau berbuat demikian? Kami mencari Engkau dengan cemas.” Yesus lalu pulang bersama mereka ke Nazaret dan taat kepada mereka. Ia bertumbuh dalam hikmat dan disayang Allah dan manusia."],
"Yesus Dicobai di Padang Gurun":["Setelah dibaptis, Roh Allah membawa Yesus ke padang gurun. Di sana Ia berpuasa empat puluh hari dan empat puluh malam, sehingga tubuh-Nya sangat lapar. Pada saat itulah iblis datang untuk mencobai Dia.","Pertama, iblis berkata, “Jika Engkau Anak Allah, suruhlah batu-batu ini menjadi roti.” Yesus menjawab, “Manusia hidup bukan dari roti saja, tetapi dari setiap firman yang keluar dari mulut Allah.” Lalu iblis membawa-Nya ke puncak Bait Allah dan menyuruh-Nya melompat. Yesus menjawab, “Jangan mencobai Tuhan, Allahmu.”","Terakhir, iblis menunjukkan semua kerajaan dunia dan berkata, “Semuanya ini kuberikan kepada-Mu jika Engkau sujud menyembah aku.” Yesus berkata tegas, “Enyahlah Iblis! Hanya kepada Tuhan, Allahmu, engkau harus sujud.” Iblis pun pergi, dan malaikat-malaikat datang melayani Yesus."],
"Khotbah di Bukit":["Banyak sekali orang mengikuti Yesus ke mana pun Ia pergi. Suatu hari Yesus naik ke atas bukit, duduk, dan murid-murid-Nya datang mengelilingi-Nya. Dengan penuh kasih Ia mulai mengajar mereka tentang bagaimana hidup yang berbahagia di mata Allah.","Yesus berkata bahwa berbahagialah orang yang rendah hati, yang lemah lembut, yang membawa damai, dan yang murah hati. Mereka mungkin tidak terkenal, tetapi Allah sangat menyayangi mereka. Pengajaran ini mengejutkan banyak orang, sebab Yesus mengajarkan kebaikan yang datang dari dalam hati.","Lalu Yesus berkata, “Kamu adalah garam dunia dan terang dunia. Kota yang terletak di atas gunung tidak mungkin tersembunyi. Orang tidak menyalakan pelita lalu menutupnya, tetapi menaruhnya di atas kaki dian.” Maksud-Nya, hidup kita harus bersinar dengan perbuatan baik, supaya orang lain melihatnya dan memuji Bapa di surga."],
"Yesus Mengajar Doa Bapa Kami":["Suatu hari Yesus sedang berdoa di suatu tempat. Murid-murid-Nya memperhatikan betapa dekat Yesus dengan Bapa-Nya. Setelah selesai, salah seorang murid berkata, “Tuhan, ajarlah kami berdoa.” Yesus senang dengan permintaan itu.","Yesus berkata bahwa berdoa bukan soal kata-kata yang panjang atau pamer kepada orang lain. Berdoalah di tempat yang tenang, sebab Bapa melihat hati kita dan sudah tahu apa yang kita perlukan. Berdoa itu seperti berbicara dengan ayah yang sangat menyayangi kita.","Lalu Yesus mengajarkan doa itu: memuji Bapa di surga, memohon agar kehendak-Nya jadi di bumi, meminta makanan secukupnya untuk hari ini, memohon pengampunan sambil mengampuni orang lain, dan meminta dijauhkan dari yang jahat. Doa ini disebut Doa Bapa Kami, dan sampai sekarang diucapkan oleh orang-orang di seluruh dunia."],
"Perumpamaan Penabur":["Suatu hari orang banyak berkumpul di tepi danau, sehingga Yesus naik ke perahu dan mengajar dari sana. Ia bercerita tentang seorang penabur yang keluar menabur benih di ladangnya. Saat benih itu ditebar, jatuhlah di berbagai tempat.","Sebagian jatuh di pinggir jalan dan dimakan burung. Sebagian jatuh di tanah berbatu, cepat tumbuh tetapi layu saat matahari terik karena akarnya tidak dalam. Sebagian jatuh di semak duri, dan tercekik. Tetapi sebagian jatuh di tanah yang baik dan berbuah, ada yang tiga puluh, enam puluh, bahkan seratus kali lipat.","Kemudian Yesus menjelaskan kepada murid-murid-Nya bahwa benih itu adalah firman Allah. Hati kita seperti tanah. Kalau kita mendengarkan, mengerti, dan menyimpan firman Tuhan dalam hati, maka hidup kita akan berbuah kebaikan. Yesus berkata, “Siapa mempunyai telinga, hendaklah ia mendengar!”"],
"Yesus Berdoa di Getsemani":["Setelah makan malam bersama murid-murid-Nya, Yesus pergi ke taman Getsemani di kaki bukit Zaitun. Hati-Nya sangat sedih, sebab Ia tahu bahwa saat yang berat sudah dekat. Ia mengajak tiga murid-Nya, Petrus, Yakobus, dan Yohanes, untuk menemani-Nya.","“Tinggallah di sini dan berjaga-jagalah bersama-Ku,” kata Yesus. Lalu Ia berjalan sedikit lebih jauh, sujud ke tanah, dan berdoa, “Ya Bapa-Ku, jikalau mungkin, biarlah cawan ini lalu dari pada-Ku. Tetapi bukan seperti yang Kukehendaki, melainkan seperti yang Engkau kehendaki.”","Ketika Yesus kembali, murid-murid-Nya tertidur karena sangat lelah. Yesus membangunkan mereka dengan lembut, lalu berdoa lagi sampai tiga kali. Setelah itu, hati-Nya kuat dan siap menjalani rencana Bapa. Dari cerita ini kita belajar bahwa kita boleh berdoa dengan jujur, bahkan saat sedih, dan tetap percaya bahwa Allah punya rencana yang baik."],
"Sarapan di Tepi Pantai":["Setelah Yesus bangkit, Petrus dan beberapa murid pergi menjala ikan di danau Galilea. Mereka bekerja semalam suntuk, tetapi tidak menangkap apa-apa. Ketika fajar menyingsing, mereka lelah dan kecewa.","Dari pantai, seorang laki-laki berseru, “Anak-anak, adakah kamu mempunyai lauk?” “Tidak ada,” jawab mereka. Orang itu berkata, “Lemparkanlah jalamu di sebelah kanan perahu, maka kamu akan mendapat.” Mereka menurutinya, dan jala itu penuh sekali dengan ikan, sampai tidak dapat ditarik.","Yohanes berseru, “Itu Tuhan!” Petrus langsung melompat ke air dan berenang ke pantai. Di sana Yesus sudah menyalakan api dan memanggang ikan serta roti. “Marilah sarapan,” kata Yesus. Yesus tidak hanya menolong mereka, tetapi juga melayani dan memperhatikan kebutuhan sahabat-sahabat-Nya."],
"Biji Sesawi":["Suatu hari Yesus ingin menjelaskan seperti apa Kerajaan Allah itu. Ia berkata, “Kerajaan Surga seumpama biji sesawi yang diambil seseorang dan ditaburnya di ladangnya.” Biji sesawi itu sangat, sangat kecil, hampir tidak kelihatan di telapak tangan.","Meskipun kecil, biji itu bertumbuh. Hari demi hari, tunasnya muncul dari tanah, batangnya menjadi kuat, dan daunnya makin lebat. Akhirnya biji kecil itu menjadi pohon yang lebih besar daripada semua sayuran lain di kebun.","Pohon itu begitu besar sampai burung-burung di udara datang bersarang di dahan-dahannya. Yesus ingin kita tahu bahwa awal yang kecil tidak berarti hasil yang kecil. Iman kita mungkin sekecil biji sesawi, tetapi jika kita memupuknya dengan berdoa dan mengikut Yesus, iman itu akan tumbuh besar dan menolong banyak orang."],
"Persembahan Janda Miskin":["Suatu hari Yesus duduk di Bait Allah, di dekat kotak persembahan, dan memperhatikan orang-orang yang datang memasukkan uang. Banyak orang kaya memasukkan uang yang banyak dan terdengar gemerincing. Mereka mungkin berharap orang lain melihatnya.","Lalu datanglah seorang janda miskin. Ia tidak punya suami dan hampir tidak punya apa-apa. Dengan pelan, ia memasukkan dua keping uang tembaga yang sangat kecil nilainya. Hampir tidak ada orang yang memperhatikannya.","Yesus memanggil murid-murid-Nya dan berkata, “Sesungguhnya janda miskin ini memberi lebih banyak daripada semua orang yang lain. Mereka memberi dari kelimpahan, tetapi dia memberi dari kekurangannya, bahkan seluruh nafkahnya.” Bagi Allah, yang paling penting bukan banyaknya pemberian, melainkan hati yang tulus dan penuh kasih."],
"Hari Pentakosta":["Sebelum naik ke surga, Yesus berjanji akan mengirim Roh Kudus. Para murid pun menunggu di Yerusalem sambil berdoa bersama. Pada hari raya Pentakosta, mereka semua sedang berkumpul di satu tempat.","Tiba-tiba terdengar bunyi dari langit seperti angin yang bertiup keras, memenuhi seluruh rumah. Lidah-lidah seperti nyala api tampak di atas kepala masing-masing. Mereka semua dipenuhi Roh Kudus, dan mulai berbicara dalam bahasa-bahasa lain yang belum pernah mereka pelajari.","Orang-orang dari berbagai negeri yang sedang berada di Yerusalem heran, sebab masing-masing mendengar murid-murid itu berbicara dalam bahasa mereka sendiri tentang perbuatan-perbuatan besar Allah. Petrus lalu berdiri dengan berani dan menceritakan tentang Yesus. Pada hari itu, tiga ribu orang percaya dan dibaptis, dan gereja pun mulai bertumbuh."],
"Petrus Keluar dari Penjara":["Raja Herodes menangkap Petrus dan memasukkannya ke penjara. Petrus dijaga oleh enam belas prajurit dan dirantai di antara dua prajurit. Ia dikurung rapat dan sepertinya tidak ada jalan keluar.","Tetapi jemaat tidak menyerah. Mereka berkumpul di sebuah rumah dan berdoa dengan sungguh-sungguh untuk Petrus. Malam itu, ketika Petrus sedang tidur, tiba-tiba seorang malaikat muncul dan cahaya bersinar di dalam penjara. Malaikat menepuk Petrus, “Bangunlah cepat!” dan rantainya pun terlepas dari tangannya.","Malaikat menuntunnya melewati para penjaga, dan pintu gerbang besi terbuka dengan sendirinya. Petrus mengetuk pintu rumah tempat jemaat berdoa. Seorang gadis bernama Rode begitu senang mendengar suaranya sampai lupa membuka pintu, dan berlari memberi tahu yang lain! Mereka hampir tidak percaya doa mereka dijawab secepat itu."],
"Langit dan Bumi yang Baru":["Pada akhir kitab Wahyu, rasul Yohanes diberi penglihatan yang luar biasa tentang masa depan. Ia melihat langit yang baru dan bumi yang baru, sebab langit dan bumi yang lama sudah berlalu. Laut pun tidak ada lagi.","Yohanes juga melihat kota yang kudus, Yerusalem yang baru, turun dari surga dari Allah. Kota itu indah seperti pengantin perempuan yang berhias untuk suaminya. Lalu ia mendengar suara nyaring dari takhta, “Lihatlah, kemah Allah ada di tengah-tengah manusia. Ia akan diam bersama mereka.”","Suara itu melanjutkan, “Allah akan menghapus segala air mata dari mata mereka, dan maut tidak akan ada lagi. Tidak akan ada lagi perkabungan, atau ratap tangis, atau dukacita.” Lalu Dia yang duduk di atas takhta berkata, “Lihatlah, Aku menjadikan segala sesuatu baru!” Inilah janji indah bagi semua orang yang percaya kepada Yesus."]
});
S.push(
{e:"🍷",t:"Mukjizat di Pesta Kana",r:"Yohanes 2:1–11",v:8,p:"Mukjizat terjadi ketika kita taat pada perkataan Yesus.",l:["Di desa Kana ada pesta pernikahan yang meriah. Yesus, Maria ibu-Nya, dan murid-murid-Nya juga diundang. Tiba-tiba tuan rumah kehabisan anggur, dan itu membuat mereka malu.","Maria memberi tahu Yesus, lalu berkata kepada para pelayan, “Lakukan apa pun yang dikatakan-Nya kepadamu.” Ada enam tempayan batu besar di sana. Yesus berkata, “Isilah tempayan-tempayan itu sampai penuh dengan air.” Para pelayan menurut dan mengisinya sampai ke bibir tempayan.","Lalu Yesus berkata, “Sekarang cedoklah dan bawa kepada pemimpin pesta.” Ketika pemimpin pesta mencicipinya, air itu sudah menjadi anggur yang paling enak! Ia heran karena biasanya anggur terbaik disajikan lebih dulu. Inilah mukjizat pertama Yesus, dan murid-murid-Nya makin percaya kepada-Nya."]},
{e:"🛡️",t:"Iman Seorang Perwira",r:"Matius 8:5–13",v:30,p:"Iman yang besar percaya bahwa perkataan Yesus penuh kuasa.",l:["Di kota Kapernaum tinggal seorang perwira Romawi. Ia punya hamba yang sangat dikasihinya, dan hamba itu sakit lumpuh dan sangat menderita. Ketika perwira itu mendengar Yesus datang, ia segera menemui-Nya dan meminta tolong.","Yesus berkata, “Aku akan datang menyembuhkannya.” Tetapi perwira itu menjawab, “Tuhan, aku tidak layak menerima Engkau di rumahku. Katakan saja sepatah kata, maka hambaku akan sembuh. Aku pun punya prajurit di bawahku, dan bila kuperintahkan sesuatu, mereka melakukannya.”","Yesus heran dan berkata kepada orang-orang di sekitar-Nya, bahwa iman sebesar itu belum pernah ditemui-Nya, bahkan di Israel. Lalu Ia berkata kepada perwira itu, “Pulanglah, terjadilah seperti yang engkau percayai.” Pada saat itu juga hambanya sembuh."]},
{e:"🧒",t:"Anak Perempuan Yairus",r:"Markus 5:21–43",v:2,p:"Jangan takut, percayalah saja kepada Yesus.",l:["Yairus adalah pemimpin rumah ibadat. Anak perempuannya yang berumur dua belas tahun sakit parah. Dengan cemas, ia bersujud di kaki Yesus dan memohon, “Anakku hampir mati. Datanglah dan letakkan tangan-Mu atasnya.” Yesus pun segera pergi bersamanya.","Di tengah jalan orang banyak berdesakan. Seorang perempuan yang sudah dua belas tahun sakit menjamah jubah Yesus dari belakang, dan ia sembuh seketika. Saat Yesus berbicara dengannya, datang kabar sedih bahwa anak Yairus sudah meninggal. Yesus berkata kepada Yairus, “Jangan takut, percaya saja!”","Sesampainya di rumah, orang-orang menangis. Yesus masuk dan memegang tangan anak itu, lalu berkata, “Talita kum,” yang berarti, “Hai anak, bangunlah!” Anak itu langsung bangkit dan berjalan. Yesus menyuruh mereka memberinya makan, dan semua orang takjub."]},
{e:"🏗️",t:"Dua Dasar Rumah",r:"Matius 7:24–27",v:8,p:"Mendengar firman Tuhan lalu melakukannya membuat hidup kita kokoh.",l:["Di akhir pengajaran-Nya di bukit, Yesus menceritakan dua orang yang membangun rumah. Orang pertama bijaksana. Ia menggali dalam-dalam dan mendirikan rumahnya di atas batu yang kokoh.","Orang kedua tidak bijaksana. Ia membangun rumahnya di atas pasir, karena itu lebih mudah dan cepat. Kedua rumah itu tampak sama indahnya. Tetapi tak lama kemudian hujan turun lebat, banjir datang, dan angin menghantam kedua rumah itu.","Rumah di atas batu tetap berdiri, sebab dasarnya kuat. Rumah di atas pasir roboh dengan dahsyat. Yesus berkata bahwa orang yang mendengar perkataan-Nya dan melakukannya seperti orang bijaksana itu. Kalau kita menaati firman Tuhan, hidup kita tidak mudah goyah saat badai datang."]},
{e:"🐑",t:"Domba yang Hilang",r:"Lukas 15:1–7",v:0,p:"Yesus mencari dan menyayangi setiap orang, termasuk yang tersesat.",l:["Suatu hari banyak orang berdosa mendekat untuk mendengarkan Yesus, dan pemimpin agama mengeluh. Maka Yesus bercerita tentang seorang gembala yang memiliki seratus ekor domba. Gembala itu mengenal setiap dombanya dan menyayangi mereka semua.","Suatu hari ia menghitung dombanya, dan satu ekor hilang. Ia tidak berkata, “Ah, masih ada sembilan puluh sembilan.” Ia meninggalkan yang lain di padang, lalu berjalan mencari domba itu melewati semak dan bukit, sampai ia menemukannya.","Ketika ketemu, gembala itu mengangkat domba itu ke atas bahunya dengan gembira. Sesampai di rumah, ia memanggil teman-temannya, “Bersukacitalah bersama aku, sebab dombaku yang hilang sudah kutemukan!” Yesus berkata bahwa di surga ada sukacita besar ketika satu orang kembali kepada Allah."]},
{e:"🏡",t:"Maria dan Marta",r:"Lukas 10:38–42",v:22,p:"Mendengarkan Yesus adalah hal yang paling penting.",l:["Yesus dan murid-murid-Nya tiba di sebuah desa, dan seorang perempuan bernama Marta menerima mereka di rumahnya. Marta senang sekali, tetapi ia juga repot. Ada banyak tamu yang harus dijamu, jadi ia sibuk menyiapkan makanan.","Sementara itu, adiknya, Maria, duduk di dekat kaki Yesus dan mendengarkan perkataan-Nya. Lama-lama Marta merasa kesal. Ia menghampiri Yesus dan berkata, “Tuhan, tidakkah Engkau peduli bahwa adikku membiarkan aku melayani sendirian? Suruhlah dia membantu aku.”","Dengan lembut Yesus menjawab, “Marta, Marta, engkau khawatir dan menyusahkan diri dengan banyak hal, padahal hanya satu yang perlu. Maria telah memilih bagian yang terbaik.” Yesus tidak melarang kita bekerja dan melayani, tetapi mengingatkan bahwa waktu bersama Dia dan mendengarkan firman-Nya adalah yang terpenting."]},
{e:"🙌",t:"Sepuluh Orang Kusta",r:"Lukas 17:11–19",v:7,p:"Bersyukurlah dan ucapkan terima kasih kepada Tuhan.",l:["Dalam perjalanan ke Yerusalem, Yesus memasuki sebuah desa. Di sana sepuluh orang berpenyakit kusta berdiri dari jauh, sebab mereka tidak boleh mendekati orang lain. Mereka berseru, “Yesus, Guru, kasihanilah kami!”","Yesus melihat mereka dan berkata, “Pergilah, perlihatkan dirimu kepada imam-imam.” Mereka menurut, dan saat sedang berjalan, tubuh mereka menjadi sembuh dan bersih! Kesepuluh orang itu pasti sangat gembira dan bergegas melanjutkan perjalanan.","Tetapi satu orang, seorang Samaria, berbalik. Ia memuji Allah dengan suara nyaring, lalu sujud di kaki Yesus dan mengucap terima kasih. Yesus bertanya, “Bukankah kesepuluh orang tadi sembuh? Di manakah yang sembilan lagi?” Lalu Ia berkata kepada orang itu, “Berdirilah dan pergilah, imanmu telah menyelamatkan engkau.”"]},
{e:"🌿",t:"Yesus Masuk ke Yerusalem",r:"Matius 21:1–11",v:17,p:"Kita boleh menyambut Yesus sebagai Raja dengan sukacita.",l:["Beberapa hari sebelum Paskah, Yesus dan murid-murid-Nya mendekati Yerusalem. Yesus mengutus dua murid, “Pergilah ke desa di depanmu. Di sana kamu akan menemukan seekor keledai bersama anaknya. Bawalah kepada-Ku.” Mereka pergi dan menemukannya persis seperti kata Yesus.","Para murid meletakkan jubah mereka di atas keledai itu, lalu Yesus duduk di atasnya. Yesus tidak menunggang kuda perang seperti raja-raja dunia, tetapi seekor keledai, tanda kerendahan hati. Banyak orang menghamparkan jubah mereka di jalan.","Yang lain memotong ranting-ranting pohon dan menyebarkannya. Orang banyak berseru, “Hosana bagi Anak Daud! Diberkatilah Dia yang datang dalam nama Tuhan!” Seluruh kota gempar, dan orang bertanya, “Siapakah Dia?” Orang banyak menjawab, “Inilah nabi Yesus dari Nazaret di Galilea.”"]},
{e:"🧼",t:"Yesus Membasuh Kaki Murid",r:"Yohanes 13:1–17",v:11,p:"Pemimpin yang sejati rela melayani.",l:["Pada malam sebelum Yesus ditangkap, Ia makan bersama kedua belas murid-Nya. Pada masa itu jalan penuh debu dan kaki orang kotor, dan biasanya hamba yang membasuh kaki para tamu. Tetapi malam itu tidak ada hamba.","Yesus bangkit, menanggalkan jubah-Nya, mengikatkan kain lenan di pinggang, dan menuangkan air ke dalam sebuah baskom. Lalu Ia mulai membasuh kaki murid-murid-Nya satu per satu dan menyekanya dengan kain itu. Petrus berkata, “Tuhan, Engkau hendak membasuh kakiku?”","Setelah selesai, Yesus berkata bahwa Ia, yang adalah Guru dan Tuhan, sudah membasuh kaki mereka, jadi mereka pun harus saling membasuh kaki. Yesus ingin kita saling melayani dengan rendah hati dan penuh kasih."]},
{e:"☁️",t:"Yesus Naik ke Surga",r:"Kisah Para Rasul 1:1–11",v:3,p:"Yesus selalu menyertai kita dan akan datang kembali.",l:["Setelah bangkit, Yesus menampakkan diri kepada murid-murid-Nya selama empat puluh hari. Ia mengajar mereka tentang Kerajaan Allah dan meyakinkan mereka bahwa Ia benar-benar hidup. Mereka makan bersama-Nya dan mendengar kata-kata-Nya yang penuh damai.","Suatu hari Yesus membawa mereka ke bukit Zaitun dan berkata bahwa mereka akan menerima kuasa ketika Roh Kudus turun atas mereka. Mereka akan menjadi saksi-Nya di Yerusalem, di seluruh Yudea dan Samaria, sampai ke ujung bumi.","Setelah mengatakan itu, Yesus terangkat ke langit, dan awan menyembunyikan-Nya dari pandangan mereka. Para murid terus menatap ke langit. Tiba-tiba dua orang berpakaian putih berkata, “Mengapa kamu berdiri melihat ke langit? Yesus akan datang kembali dengan cara yang sama.” Para murid pun pulang dengan sukacita."]},
{e:"🧵",t:"Tabita Dibangkitkan",r:"Kisah Para Rasul 9:36–43",v:10,p:"Perbuatan baik yang kecil bisa membawa kebahagiaan bagi banyak orang.",l:["Di kota Yope tinggal seorang murid perempuan bernama Tabita, yang juga disebut Dorkas. Ia sangat baik hati dan suka menolong orang miskin. Dengan tangannya sendiri ia menjahit banyak baju untuk orang yang membutuhkan.","Suatu hari Tabita sakit dan meninggal. Semua orang sedih, sebab ia sangat dikasihi. Murid-murid mendengar bahwa Petrus sedang berada di dekat kota itu, lalu mengutus dua orang untuk memanggilnya. Petrus datang, dan para janda menangis sambil menunjukkan baju-baju yang dijahit Tabita.","Petrus meminta semua orang keluar, lalu berlutut dan berdoa. Ia berkata, “Tabita, bangkitlah!” Tabita membuka matanya, melihat Petrus, dan duduk. Petrus memegang tangannya dan membantunya berdiri. Berita ini tersebar ke seluruh Yope, dan banyak orang menjadi percaya kepada Tuhan."]},
{e:"🎵",t:"Paulus dan Silas di Penjara",r:"Kisah Para Rasul 16:16–34",v:7,p:"Kita bisa memuji Tuhan bahkan dalam keadaan sulit.",l:["Di kota Filipi, Paulus dan Silas dipukuli dan dilemparkan ke dalam penjara paling dalam, dengan kaki terpasang pada pasungan. Tubuh mereka sakit, dan hari sudah tengah malam. Kebanyakan orang pasti akan mengeluh atau menangis.","Tetapi Paulus dan Silas berdoa dan menyanyikan puji-pujian kepada Allah, sementara para tahanan lain mendengarkan. Tiba-tiba terjadi gempa bumi yang dahsyat. Dasar penjara goyang, semua pintu terbuka, dan belenggu semua orang terlepas.","Kepala penjara terbangun dan takut karena mengira para tahanan sudah kabur. Tetapi Paulus berseru, “Jangan celakai dirimu, kami semua masih di sini!” Kepala penjara gemetar, lalu bertanya, “Apa yang harus kuperbuat supaya selamat?” Mereka menjawab, “Percayalah kepada Tuhan Yesus.” Malam itu juga ia dan seluruh keluarganya dibaptis dengan gembira."]},
{e:"💎",t:"Perumpamaan Talenta",r:"Matius 25:14–30",v:9,p:"Gunakan apa yang Tuhan berikan dengan rajin dan setia.",l:["Yesus bercerita tentang seorang tuan yang akan bepergian jauh. Sebelum berangkat, ia memanggil tiga hambanya dan mempercayakan hartanya kepada mereka. Hamba pertama menerima lima talenta, yang kedua dua talenta, dan yang ketiga satu talenta.","Hamba pertama dan kedua bekerja dengan rajin dan menggandakan uang itu. Hamba ketiga takut dan menggali lubang, lalu menyembunyikan uang tuannya di dalam tanah. Setelah lama, tuan itu pulang dan meminta pertanggungjawaban.","Kepada dua hamba pertama, tuan itu berkata bahwa mereka hamba yang baik dan setia, dan mengajak mereka ikut bersukacita. Tetapi hamba ketiga ditegur karena tidak mau berusaha. Dari cerita ini kita belajar bahwa Tuhan memberi kita kemampuan yang berbeda-beda, dan Ia senang ketika kita memakainya dengan sepenuh hati."]},
{e:"🌙",t:"Nikodemus Bertemu Yesus",r:"Yohanes 3:1–16",v:0,p:"Yesus mengundang kita memulai hidup baru bersama Allah.",l:["Nikodemus adalah seorang pemimpin agama yang terkenal dan pandai. Namun ia punya banyak pertanyaan tentang Yesus. Karena takut dilihat orang, ia datang kepada Yesus pada malam hari dan berkata, “Guru, kami tahu Engkau datang dari Allah, sebab tidak ada yang dapat melakukan tanda-tanda ajaib seperti Engkau.”","Yesus berkata bahwa seseorang harus dilahirkan kembali supaya dapat melihat Kerajaan Allah. Nikodemus bingung, “Bagaimana mungkin orang yang sudah tua dilahirkan lagi?” Yesus menjelaskan bahwa maksud-Nya adalah kelahiran baru oleh Roh Allah, seperti angin yang bertiup dan terasa, tetapi tidak terlihat.","Lalu Yesus menyampaikan kabar yang sangat indah: Allah begitu mengasihi dunia ini sehingga Ia memberikan Anak-Nya yang tunggal, supaya semua orang yang percaya kepada-Nya tidak binasa dan memiliki hidup kekal. Nikodemus pulang membawa banyak hal untuk dipikirkan, dan kemudian ia menjadi pengikut Yesus."]}
);
S.push(
{e:"👁️",t:"Orang Buta Sejak Lahir",r:"Yohanes 9:1–38",v:10,p:"Yesus adalah terang dunia, dan Ia membuka mata kita untuk melihat kebaikan Allah.",l:["Suatu hari Yesus melihat seorang laki-laki yang buta sejak lahir. Murid-murid bertanya mengapa ia buta, tetapi Yesus berkata bahwa hal itu terjadi supaya perbuatan Allah dinyatakan. Lalu Yesus berkata, “Akulah terang dunia.”","Yesus meludah ke tanah, membuat lumpur, dan mengoleskannya ke mata laki-laki itu. Ia berkata, “Pergilah, basuhlah dirimu di kolam Siloam.” Laki-laki itu percaya dan menurut. Ketika ia membasuh matanya, ia bisa melihat untuk pertama kalinya!","Tetangganya heran dan para pemimpin agama menanyainya berkali-kali. Dengan berani laki-laki itu berkata, “Dahulu aku buta, sekarang aku melihat.” Kemudian Yesus menemuinya lagi, dan laki-laki itu berkata, “Aku percaya, Tuhan,” lalu menyembah Yesus."]},
{e:"🚶",t:"Perjalanan ke Emaus",r:"Lukas 24:13–35",v:3,p:"Yesus berjalan bersama kita, bahkan ketika kita tidak menyadarinya.",l:["Pada hari Yesus bangkit, dua pengikut-Nya berjalan pulang ke desa Emaus sambil bercakap-cakap dengan sedih tentang semua yang terjadi. Mereka tidak tahu bahwa Yesus sudah bangkit. Tiba-tiba seorang asing ikut berjalan bersama mereka.","Orang asing itu bertanya apa yang mereka bicarakan. Mereka menceritakan semuanya dengan muram. Lalu orang itu menjelaskan isi Kitab Suci tentang Mesias, dari Musa sampai para nabi. Hati mereka terasa hangat mendengarnya, tetapi mereka belum mengenali-Nya.","Ketika tiba di Emaus, mereka mengajak-Nya menginap. Saat duduk makan, orang itu mengambil roti, mengucap berkat, memecah-mecahkannya, dan memberikannya kepada mereka. Seketika mata mereka terbuka. Itu Yesus! Lalu Ia menghilang. Mereka segera berlari pulang ke Yerusalem menceritakan kabar baik itu."]},
{e:"🍞",t:"Perjamuan Terakhir",r:"Lukas 22:14–20",v:11,p:"Yesus mengajak kita mengingat kasih-Nya setiap kali kita berbagi roti dan anggur.",l:["Pada malam sebelum Yesus ditangkap, Ia berkumpul bersama kedua belas murid-Nya di sebuah ruang atas untuk makan Paskah. Yesus berkata, “Aku sangat rindu makan Paskah ini bersama-sama dengan kamu.”","Sambil makan, Yesus mengambil roti, mengucap syukur, memecahkannya, dan membagikannya kepada murid-murid-Nya. Ia berkata, “Inilah tubuh-Ku yang diberikan bagimu. Lakukanlah ini untuk mengingat Aku.”","Sesudah makan, Yesus mengambil cawan dan berkata, bahwa cawan itu adalah perjanjian baru yang dibuat dengan darah-Nya yang dicurahkan bagi banyak orang. Sampai sekarang, orang percaya mengikuti Perjamuan Kudus untuk mengingat bahwa Yesus mengasihi kita sampai rela memberikan diri-Nya."]},
{e:"🐪",t:"Filipus dan Pejabat dari Etiopia",r:"Kisah Para Rasul 8:26–40",v:19,p:"Allah mengutus kita supaya semakin banyak orang mengenal Yesus.",l:["Suatu hari malaikat Tuhan menyuruh Filipus pergi ke jalan yang sepi dari Yerusalem ke Gaza. Di sana ia melihat sebuah kereta. Di dalamnya duduk seorang pejabat tinggi dari Etiopia yang sedang membaca gulungan Kitab Nabi Yesaya dengan suara pelan.","Roh Kudus berkata kepada Filipus, “Dekatilah kereta itu.” Filipus berlari dan bertanya, “Mengertikah engkau apa yang kaubaca?” Orang itu menjawab, “Bagaimana aku dapat mengerti kalau tidak ada yang menjelaskannya?” Ia mengundang Filipus naik dan duduk bersamanya.","Filipus menerangkan bahwa bagian itu bercerita tentang Yesus. Pejabat itu percaya. Saat melihat air di tepi jalan, ia berkata, “Lihat, ada air! Apa halangannya aku dibaptis?” Filipus membaptisnya. Lalu Roh Tuhan membawa Filipus pergi, dan pejabat itu melanjutkan perjalanan dengan penuh sukacita."]},
{e:"⛵",t:"Paulus Selamat dari Badai",r:"Kisah Para Rasul 27:13–44",v:2,p:"Allah menjaga kita di tengah badai, jadi jangan takut.",l:["Paulus berlayar sebagai tahanan menuju Roma bersama prajurit dan banyak penumpang. Di tengah laut, badai besar datang. Angin menghantam, ombak bergulung-gulung, dan selama berhari-hari matahari dan bintang tidak tampak. Semua orang kehilangan harapan.","Tetapi Paulus berdiri dan berkata, “Jangan takut! Tadi malam seorang malaikat Allah berdiri di dekatku dan berkata bahwa kita semua akan selamat.” Ia mengajak semua orang makan untuk menguatkan tubuh, dan ia mengucap syukur kepada Allah di hadapan mereka.","Setelah empat belas hari, kapal itu kandas dan mulai pecah dihantam ombak. Semua orang, dua ratus tujuh puluh enam jiwa, ada yang berenang dan ada yang berpegangan pada papan kapal, dan semuanya selamat tiba di daratan, di pulau Malta. Penduduk pulau itu menyambut mereka dengan ramah."]},
{e:"🪔",t:"Sepuluh Gadis",r:"Matius 25:1–13",v:9,p:"Selalu bersiap melakukan yang benar, sebab kita tidak tahu kapan Yesus datang.",l:["Yesus bercerita tentang sepuluh gadis yang menanti pengantin laki-laki dalam sebuah pesta pernikahan. Mereka membawa pelita untuk menyambutnya. Lima gadis bijaksana membawa minyak cadangan, tetapi lima gadis lainnya tidak membawa apa-apa.","Pengantin laki-laki datang terlambat, sehingga semua gadis mengantuk dan tertidur. Tiba-tiba tengah malam terdengar seruan, “Pengantin datang! Songsonglah dia!” Mereka semua bangun dan menyiapkan pelita, tetapi pelita lima gadis yang bodoh hampir padam.","Mereka meminta minyak kepada yang lain, tetapi minyak itu hanya cukup untuk yang bijaksana. Saat mereka pergi membeli minyak, pengantin tiba dan pintu pesta ditutup. Yesus berkata, “Berjaga-jagalah, karena kamu tidak tahu hari maupun saatnya.” Maksudnya, kita harus hidup siap setiap hari."]},
{e:"🙇",t:"Orang Farisi dan Pemungut Cukai",r:"Lukas 18:9–14",v:26,p:"Allah suka kepada hati yang rendah dan jujur.",l:["Yesus bercerita untuk orang-orang yang merasa diri paling benar dan memandang rendah orang lain. Dua orang pergi ke Bait Allah untuk berdoa. Yang satu seorang Farisi, yang lain seorang pemungut cukai.","Orang Farisi berdiri dan berdoa dengan bangga, “Ya Allah, aku bersyukur karena aku tidak seperti orang lain. Aku berpuasa dan memberi persembahan.” Ia lebih sibuk membandingkan dirinya dengan orang lain daripada memandang Allah.","Sementara itu pemungut cukai berdiri jauh, bahkan tidak berani menengadah. Ia memukul dadanya dan berdoa, “Ya Allah, kasihanilah aku orang berdosa ini.” Yesus berkata bahwa pemungut cukai inilah yang pulang dengan dibenarkan Allah. Siapa merendahkan diri akan ditinggikan."]},
{e:"🕊️",t:"Anak Janda di Nain",r:"Lukas 7:11–17",v:1,p:"Yesus peduli pada kesedihan kita dan sanggup memberi hidup.",l:["Yesus dan murid-murid-Nya tiba di pintu gerbang kota Nain. Pada saat itu, ada iring-iringan pemakaman. Seorang pemuda, anak satu-satunya dari seorang janda, telah meninggal. Janda itu menangis, dan banyak orang kota menemaninya.","Ketika Tuhan melihat janda itu, hati-Nya sangat tergerak oleh belas kasihan. Ia berkata kepadanya, “Jangan menangis!” Lalu Yesus mendekati usungan dan menyentuhnya. Para pengusung berhenti, dan semua orang menahan napas.","Yesus berkata, “Hai anak muda, Aku berkata kepadamu, bangunlah!” Orang yang mati itu duduk dan mulai berbicara. Yesus menyerahkannya kepada ibunya. Semua orang takut dan kagum, lalu memuliakan Allah. Kabar ini tersebar ke seluruh daerah itu."]},
{e:"✨",t:"Yesus Berubah Rupa",r:"Matius 17:1–8",v:18,p:"Yesus sungguh Anak Allah, dan kita diajak mendengarkan Dia.",l:["Suatu hari Yesus mengajak tiga murid-Nya, Petrus, Yakobus, dan Yohanes, naik ke sebuah gunung yang tinggi untuk berdoa. Mereka hanya berempat, jauh dari keramaian.","Tiba-tiba rupa Yesus berubah di depan mata mereka. Wajah-Nya bercahaya seperti matahari, dan pakaian-Nya menjadi putih berkilauan seperti terang. Musa dan Elia muncul dan berbicara dengan Yesus. Petrus berkata, “Tuhan, betapa baiknya kita di sini!”","Selagi Petrus berbicara, awan terang menaungi mereka dan terdengar suara, “Inilah Anak-Ku yang Kukasihi, kepada-Nyalah Aku berkenan. Dengarkanlah Dia!” Murid-murid sangat ketakutan dan tersungkur. Yesus menyentuh mereka dan berkata, “Bangunlah, jangan takut.” Ketika mereka melihat lagi, hanya Yesus yang ada di sana."]},
{e:"🔥",t:"Petrus Dipulihkan",r:"Yohanes 21:15–19",v:27,p:"Yesus mengampuni kita dan memberi kesempatan baru.",l:["Petrus pernah menyangkal Yesus tiga kali pada malam Yesus ditangkap. Setelah itu ia sangat menyesal dan menangis. Kini Yesus sudah bangkit, dan pagi itu, setelah sarapan di tepi danau, Yesus berbicara dengan Petrus.","Yesus bertanya, “Simon, anak Yohanes, apakah engkau mengasihi Aku?” Petrus menjawab, “Benar, Tuhan, Engkau tahu aku mengasihi Engkau.” Yesus berkata, “Gembalakanlah domba-domba-Ku.” Pertanyaan yang sama diulang sampai tiga kali, sebanyak Petrus menyangkal.","Pada pertanyaan ketiga Petrus sedih, tetapi ia menjawab dengan jujur, “Tuhan, Engkau tahu segala sesuatu, Engkau tahu bahwa aku mengasihi Engkau.” Yesus tidak marah. Ia mempercayakan tugas besar kepada Petrus dan berkata, “Ikutlah Aku.” Begitulah cara Yesus mengampuni dan memulihkan sahabat-Nya."]},
{e:"👶",t:"Simeon dan Hana Melihat Bayi Yesus",r:"Lukas 2:25–38",v:7,p:"Menanti Tuhan dengan sabar akan membawa sukacita.",l:["Di Yerusalem hiduplah seorang tua bernama Simeon. Ia saleh dan setia menantikan penghiburan bagi Israel. Roh Kudus telah menjanjikan bahwa ia tidak akan mati sebelum melihat Mesias, Juruselamat yang dijanjikan Allah.","Suatu hari Roh Kudus menuntun Simeon ke Bait Allah, tepat ketika Maria dan Yusuf membawa Bayi Yesus untuk diserahkan kepada Tuhan. Simeon menggendong Bayi itu, memuji Allah, dan berkata bahwa ia sudah melihat keselamatan dari Allah, terang bagi segala bangsa.","Pada saat itu juga, seorang nabiah tua bernama Hana, yang tinggal di Bait Allah siang dan malam sambil berdoa dan berpuasa, datang dan mengucap syukur kepada Allah. Ia menceritakan tentang Bayi itu kepada semua orang yang menantikan penebusan di Yerusalem."]},
{e:"💰",t:"Matius Meninggalkan Mejanya",r:"Matius 9:9–13",v:0,p:"Yesus memanggil kita apa adanya dan mengubah hidup kita.",l:["Matius adalah seorang pemungut cukai yang duduk di kantor pajaknya. Banyak orang tidak menyukainya karena pekerjaan itu sering dianggap curang. Ia mungkin merasa kesepian. Hari itu Yesus lewat dan melihatnya.","Yesus berkata kepadanya, “Ikutlah Aku.” Matius langsung berdiri, meninggalkan meja dan uangnya, lalu mengikut Yesus. Kemudian ia mengadakan perjamuan di rumahnya dan mengundang Yesus, murid-murid-Nya, dan banyak teman pemungut cukai dan orang berdosa.","Para pemimpin agama mengeluh, “Mengapa gurumu makan bersama orang-orang berdosa?” Yesus mendengarnya dan berkata, “Bukan orang sehat yang memerlukan tabib, tetapi orang sakit. Aku datang bukan untuk memanggil orang benar, melainkan orang berdosa.” Matius kemudian menulis salah satu kitab Injil."]},
{e:"🎒",t:"Orang Muda yang Kaya",r:"Markus 10:17–27",v:22,p:"Yesus lebih berharga daripada harta apa pun.",l:["Seorang pemuda yang kaya berlari menemui Yesus dan berlutut di hadapan-Nya. Ia bertanya, “Guru yang baik, apa yang harus kuperbuat untuk memperoleh hidup yang kekal?” Yesus mengingatkan dia tentang perintah-perintah Allah.","Pemuda itu menjawab, “Semuanya itu sudah kuturuti sejak masa mudaku.” Yesus memandang dia dan mengasihinya. Lalu Ia berkata, “Satu hal kurang padamu. Juallah apa yang kaumiliki, berikanlah kepada orang miskin, kemudian datanglah dan ikutlah Aku.”","Mendengar itu, wajah pemuda itu muram dan ia pergi dengan sedih, sebab hartanya banyak. Yesus berkata kepada murid-murid-Nya bahwa sukar sekali bagi orang yang memiliki banyak harta untuk masuk Kerajaan Allah. Namun bagi Allah segala sesuatu mungkin. Hati kita jangan sampai terikat pada harta."]}

{e:"🤝",t:"Hamba yang Tidak Mau Mengampuni",r:"Matius 18:21–35",v:4,p:"Allah sudah mengampuni kita, jadi kita pun mau mengampuni orang lain.",q:["Berapa kali Yesus berkata kita harus mengampuni?",["Tujuh puluh kali tujuh","Satu kali","Tiga kali"]],l:["Petrus bertanya kepada Yesus, “Tuhan, berapa kali aku harus mengampuni saudaraku? Sampai tujuh kali?” Yesus menjawab bahwa bukan tujuh kali, melainkan tujuh puluh kali tujuh, artinya jangan menghitung-hitung. Lalu Yesus bercerita.","Seorang raja menghapus utang besar seorang hambanya yang memohon-mohon sambil menangis. Hamba itu pulang dengan lega. Tetapi tak lama kemudian ia bertemu temannya yang berutang sedikit kepadanya. Ia menangkap temannya itu dan menolak memberi waktu, meski temannya memohon.","Ketika raja mendengar hal itu, ia memanggil hamba itu dan berkata, “Aku sudah menghapus semua utangmu. Tidakkah seharusnya engkau juga berbelas kasihan kepada temanmu?” Yesus mengajarkan bahwa karena Allah sudah mengampuni kita begitu banyak, kita pun harus mengampuni dengan tulus dari hati."]},
{e:"🐑",t:"Gembala yang Baik",r:"Yohanes 10:1–18",v:31,p:"Yesus adalah Gembala yang baik, yang mengenal dan menjaga kita.",q:["Siapa yang dipanggil nama oleh sang gembala?",["Domba-dombanya","Para pencuri","Burung-burung"]],l:["Yesus berkata bahwa seorang gembala masuk ke kandang lewat pintu, dan para domba mengenali suaranya. Ia memanggil domba-dombanya satu per satu dengan nama, lalu menuntun mereka ke padang rumput hijau. Domba-domba itu mengikutinya karena percaya.","Domba tidak mau mengikuti orang asing, sebab mereka tidak mengenal suaranya. Ada pencuri yang datang hanya untuk mencuri dan merusak. Tetapi gembala yang baik datang supaya domba-dombanya memiliki hidup yang berlimpah.","Yesus berkata, “Akulah gembala yang baik. Gembala yang baik memberikan nyawanya bagi domba-dombanya.” Ia menjaga domba-Nya dari serigala dan tidak pernah lari. Kita pun aman dalam penjagaan Yesus, yang mengenal nama kita masing-masing."]},
{e:"👶",t:"Kelahiran Yohanes Pembaptis",r:"Lukas 1:57–66",v:7,p:"Allah menepati janji-Nya, dan kita belajar taat kepada-Nya.",q:["Siapa nama bayi Zakharia dan Elisabet?",["Yohanes","Zakharia","Yusuf"]],l:["Zakharia dan Elisabet adalah pasangan yang saleh, tetapi mereka sudah tua dan belum punya anak. Malaikat Gabriel pernah datang dan berkata bahwa Elisabet akan melahirkan seorang anak. Zakharia tidak percaya, sehingga ia menjadi bisu sampai bayi itu lahir.","Ketika bayi laki-laki itu lahir, tetangga dan keluarga bersukacita. Pada hari kedelapan, mereka ingin menamainya Zakharia seperti ayahnya. Tetapi Elisabet berkata, “Namanya Yohanes.” Orang-orang heran karena tidak ada keluarga mereka yang bernama itu.","Mereka bertanya kepada Zakharia. Ia meminta papan tulis dan menulis, “Namanya Yohanes.” Seketika mulutnya terbuka dan ia dapat berbicara lagi, lalu ia memuji Allah! Semua orang takjub dan bertanya-tanya, “Akan menjadi apakah anak ini kelak?” Yohanes kelak menyiapkan jalan bagi Yesus."]},
{e:"🧣",t:"Lidia dan Kain Ungu",r:"Kisah Para Rasul 16:11–15",v:13,p:"Hati yang terbuka membuat kita mau menerima dan melayani.",q:["Apa pekerjaan Lidia?",["Penjual kain ungu","Nelayan","Tukang kayu"]],l:["Di kota Filipi, pada hari Sabat, Paulus dan teman-temannya pergi ke tepi sungai. Di sana beberapa perempuan sedang berkumpul untuk berdoa. Salah satunya bernama Lidia, seorang penjual kain ungu yang takut akan Allah.","Lidia mendengarkan Paulus dengan saksama. Tuhan membuka hatinya untuk menerima berita tentang Yesus. Ia percaya, lalu ia dan seluruh keluarganya dibaptis. Hati Lidia penuh sukacita.","Lidia lalu berkata kepada Paulus dan teman-temannya, “Jika kalian menganggap aku setia kepada Tuhan, datang dan tinggallah di rumahku.” Ia mendesak sampai mereka mau. Rumah Lidia menjadi tempat berkumpul jemaat pertama di Filipi, dan ia terkenal murah hati."]},
{e:"🏊",t:"Kolam Betesda",r:"Yohanes 5:1–9",v:1,p:"Yesus peduli kepada orang yang merasa tidak punya siapa-siapa.",q:["Berapa tahun laki-laki itu sudah sakit?",["38 tahun","3 tahun","12 tahun"]],l:["Di Yerusalem ada sebuah kolam bernama Betesda yang dikelilingi serambi. Banyak orang sakit, buta, dan lumpuh berbaring di sana, menunggu air kolam bergoyang. Di antara mereka ada seorang laki-laki yang sudah tiga puluh delapan tahun sakit.","Yesus melihatnya dan tahu ia sudah lama menderita. Yesus bertanya, “Maukah engkau sembuh?” Laki-laki itu menjawab, “Tuan, tidak ada orang yang menolongku masuk ke kolam. Selalu ada orang lain yang masuk lebih dulu.” Ia merasa sangat kesepian.","Yesus berkata, “Bangunlah, angkat tikarmu dan berjalanlah.” Seketika laki-laki itu sembuh! Ia mengangkat tikarnya dan berjalan. Orang yang tidak punya siapa-siapa itu ternyata diperhatikan oleh Yesus, yang selalu peduli kepada orang yang kesepian dan menderita."]}

function qs(lv){
  const pick=(a,n)=>shuf(a).slice(0,n);
  const opts=(r,pool,n)=>shuf([r,...pick([...new Set(pool)].filter(x=>x!==r),n-1)]).map(t=>({t,c:t===r}));
  const bk=s=>s.r.replace(/\s\d.*$/,""),ps=s=>(s.r.match(/(\d+):/)||[])[1];
  const first=s=>(s.l?s.l[0]:s.s).split(". ")[0]+".";
  const sq=s=>s.q&&{q:s.q[0],o:shuf(s.q[1].map((t,i)=>({t,c:i===0})))};
  const T={
    1:[sq,s=>({q:"Apa pelajaran dari cerita “"+s.t+"”?",o:opts(s.p,S.map(x=>x.p),3)}),s=>({q:"Cerita mana yang mengajarkan: “"+s.p+"”",o:opts(s.t,S.map(x=>x.t),3)})],
    2:[s=>({q:"Cerita “"+s.t+"” ada di kitab apa?",o:opts(bk(s),S.map(bk),4)}),s=>({q:"Ayat emas mana yang cocok untuk cerita “"+s.t+"”?",o:opts(V[s.v].r,V.map(x=>x.r),4)})],
    3:[s=>({q:"Ayat ini tertulis di mana? “"+V[s.v].m+"”",o:opts(V[s.v].r,V.map(x=>x.r),4)}),s=>ps(s)&&({q:"Cerita “"+s.t+"” ada di pasal berapa?",o:opts("Pasal "+ps(s),S.map(ps).filter(Boolean).map(n=>"Pasal "+n),4)}),s=>({q:"Cerita apa yang diawali seperti ini? “"+first(s)+"”",o:opts(s.t,S.map(x=>x.t),4)})]
  }[lv];
  const ba=src==="baca"?S.filter(s=>OPEN.has(s.t)):S,base=ba.length?ba:S;
  const gen=list=>{const c=[];list.forEach(s=>T.forEach(f=>{const x=f(s);if(x)c.push({s,x})}));return shuf(c)};
  const out=[],used=new Set();
  [gen(base),gen(S)].forEach(arr=>{
    arr.forEach(a=>{if(out.length<5&&!used.has(a.s.t)&&!out.some(o=>o.q===a.x.q)){used.add(a.s.t);out.push(a.x)}});
    arr.forEach(a=>{if(out.length<5&&!out.some(o=>o.q===a.x.q))out.push(a.x)});
  });
  return out;
}

function talk(){

  if(talking){stop();b.textContent="🔊 Bacakan untukku";return}

    const ys=[];teks.forEach(t=>(t.match(/[^.!?]+[.!?]*/g)||[t]).forEach(k=>{k=k.replace(/[“”]/g,"").trim();if(k)ys.push(k)}));

"Orang Muda yang Kaya":["Apa yang Yesus suruh dilakukan pemuda itu dengan hartanya?",["Memberikan kepada orang miskin","Menyimpannya","Membangun rumah"]]
};
S.forEach(s=>{if(!s.q&&QQ[s.t])s.q=QQ[s.t]});
const app=document.getElementById("app");
let tab="home",cur=null,Q=null,talking=false;
const shuf=a=>a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(x=>x[1]);
function stop(){try{speechSynthesis.cancel()}catch(e){}talking=false}
function go(t,i){stop();if(t==="quiz"&&Q&&Q.i>=5)Q=null;if(t==="stories"&&i!=null)mark(S[i].t);tab=t;cur=i===undefined?null:i;render();window.scrollTo(0,0)}
function talkOld(){
  const b=document.getElementById("tb");
  if(talking){stop();b.textContent="🔊 Bacakan untukku";return}
  try{
    const s=S[cur],u=new SpeechSynthesisUtterance(s.t+". "+(s.l?s.l.join(" "):s.s)+" Pelajarannya: "+s.p);
    u.lang="id-ID";u.rate=.9;
    u.onend=()=>{talking=false;b.textContent="🔊 Bacakan untukku"};
    speechSynthesis.speak(u);talking=true;b.textContent="⏹ Berhenti";
  }catch(e){b.textContent="Suara belum tersedia di HP ini"}
}
function find(q){
  q=q.toLowerCase().trim();
  const w=q.split(/[^a-z]+/).filter(x=>x.length>2);
  return V.map(v=>({v,n:v.k.filter(k=>q.includes(k)||w.some(x=>k.startsWith(x))).length}))
    .filter(x=>x.n>0).sort((a,b)=>b.n-a.n).slice(0,3).map(x=>x.v);
}
const vc=v=>`<article class="vc"><b>${v.r}</b><p>${v.m}</p><p class="mut">${v.c}</p></article>`;
function showRes(q){
  const el=document.getElementById("res");
  if(!q.trim()){el.innerHTML="<h2>Semua ayat emas</h2>"+V.map(vc).join("");return}
  const r=find(q);
  el.innerHTML=r.length?"<h2>Ayat yang cocok untukmu</h2>"+r.map(vc).join(""):
    "<p>Belum ada yang cocok. Coba kata lain, misalnya takut, sedih, atau marah. Ini dua ayat yang selalu baik dibaca:</p>"+vc(V[0])+vc(V[1]);
}
function chip(w){const i=document.getElementById("qi");i.value=w;showRes(w)}
function start(lv){
  Q={lv,i:0,sc:0,a:null,items:qs(lv)};
  render();
}
function ans(i){if(Q.a!==null)return;Q.a=i;if(Q.items[Q.i].o[i].c)Q.sc++;render()}
function next(){Q.i++;Q.a=null;render()}
const views={
home(){
  const v=V[Math.floor(Date.now()/864e5)%V.length];
  return `<section class="sun"><div class="sunE" aria-hidden="true">☀️</div><h1>Sahabat Orang Samaria</h1><p>Halo, teman kecil! Yuk belajar menjadi sesama bagi orang lain, seperti kisah Orang Samaria yang Baik.</p><p class="lbl">Ayat emas hari ini</p><p class="ref">${v.r}</p><p>${v.m}</p></section>
  <div class="tiles"><button class="tile" onclick="go('stories')"><span>📖</span>Cerita</button><button class="tile" onclick="go('verses')"><span>✨</span>Ayat Emas</button><button class="tile" onclick="go('quiz')"><span>🎯</span>Kuis</button></div>
  <section class="qcard"><h2>🎯 Kuis Cerita Alkitab</h2><p class="mut">Pilih levelmu dan uji ingatanmu.</p>${lvBtns()}</section>`;
},
stories(){
  if(cur!==null){
    const s=S[cur],v=V[s.v];
    return `<button class="back" onclick="go('stories')">‹ Semua cerita</button><div class="bigE" aria-hidden="true">${s.e}</div><h1>${s.t}</h1><p class="mut">${s.r}</p>
    <button class="btn" id="tb" onclick="talk()">🔊 Bacakan untukku</button><button class="btn sec" onclick="chV()">🎙️ Ganti suara</button><p class="note" id="vn">Kualitas suara tergantung HP. Pasang suara Bahasa Indonesia di pengaturan Text-to-speech HP agar lebih natural.</p>
    ${(s.l||[s.s]).map(x=>`<p class="story">${x}</p>`).join("")}
    <div class="box leaf"><b>Pelajaran:</b> ${s.p}</div>
    <div class="box sunb"><b>Ayat emas: ${v.r}</b><br>${v.m}</div>
    <button class="btn sec" style="margin-top:14px" onclick="go('quiz')">Main kuis</button>
    <p class="note">Cerita ini ringkasan ramah anak. Bacalah ayat lengkapnya di Alkitab bersama orang tua atau guru.</p>`;
  }
  return `<h1>Cerita Perjanjian Baru</h1><p class="mut">Pilih satu cerita untuk dibaca atau didengarkan.</p>`+
    `<input id="sf" type="search" placeholder="Cari cerita" aria-label="Cari cerita" oninput="fl(this.value)"><div id="sl">${rows("")}</div>`;
},
verses(){
  const ch=["Takut","Sedih","Marah","Berbohong","Malas belajar","Berbagi","Bersyukur","Sendirian"];
  return `<h1>Ayat Emas</h1><p class="mut">Ceritakan perasaanmu atau kejadian hari ini, nanti kucarikan ayat yang cocok.</p>
  <input id="qi" type="search" placeholder="Contoh: aku takut gelap" aria-label="Ceritakan perasaanmu" oninput="showRes(this.value)">
  <div class="chips">${ch.map(c=>`<button class="chip" onclick="chip('${c.toLowerCase()}')">${c}</button>`).join("")}</div>
  <div id="res"></div><p class="note">Pencarian ayat ini bekerja di HP kamu sendiri, tanpa internet.</p>`;
},
quiz(){
  if(!Q)return `<h1>Kuis Cerita</h1>${srcUI()}${lvBtns()}`;
  if(Q.i>=5){
    const m=Q.sc>=4?"Hebat sekali!":Q.sc>=2?"Bagus! Ayo coba lagi.":"Ayo baca ceritanya lagi, lalu main lagi.";
    return `<h1>${m}</h1><p class="stars" aria-label="${Q.sc} bintang">${"⭐".repeat(Q.sc)||"🌱"}</p><p>Kamu benar ${Q.sc} dari 5 soal.</p><button class="btn" onclick="start(Q.lv)">Main lagi</button><button class="btn sec" onclick="Q=null;render()">Ganti level</button><button class="btn sec" onclick="go('stories')">Baca cerita</button>`;
  }
  const it=Q.items[Q.i],done=Q.a!==null;
  return `<p class="mut">Level ${LV[Q.lv]}, soal ${Q.i+1} dari 5</p><h1>${it.q}</h1>`+
    it.o.map((o,i)=>`<button class="opt ${done?(o.c?"ok":(Q.a===i?"no":"")):""}" ${done?"disabled":""} onclick="ans(${i})">${o.t}</button>`).join("")+
    (done?`<p><b>${it.o[Q.a].c?"Benar! 🎉":"Belum tepat. Coba lagi di soal berikutnya."}</b></p><button class="btn" onclick="next()">${Q.i===4?"Lihat hasil":"Lanjut"}</button>`:"");
}
};
function render(){
  document.querySelectorAll(".tab").forEach(b=>{const on=b.dataset.t===tab;b.classList.toggle("on",on);if(on)b.setAttribute("aria-current","page");else b.removeAttribute("aria-current")});
  app.innerHTML=views[tab]();
  if(tab==="verses")showRes("");
}
render();
</script>
<script>
if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})}
</script>
</body>
</html>
